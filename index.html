<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKH BRAND</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050505;
color:white;
}

header{
background:#000;
text-align:center;
padding:35px 20px;
border-bottom:1px solid #222;
}

header img{
width:160px;
height:160px;
object-fit:cover;
border-radius:20px;
margin-bottom:15px;
}

header h1{
font-size:42px;
letter-spacing:4px;
}

header p{
color:#aaa;
font-size:18px;
margin-top:10px;
}

.hero{
text-align:center;
padding:60px 20px;
background:linear-gradient(#111,#050505);
}

.hero h2{
font-size:36px;
margin-bottom:15px;
}

.hero p{
color:#bbb;
font-size:20px;
}


.products{

max-width:1200px;
margin:auto;
padding:40px 20px;

display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

gap:30px;

}


.card{

background:#111;

border:1px solid #333;

border-radius:20px;

overflow:hidden;

transition:.3s;

}


.card:hover{

transform:translateY(-8px);
}  

.gallery{
position:relative;
overflow:hidden;
height:350px;
}

.slider{
display:flex;
width:100%;
height:100%;
transition:transform .4s ease;
}


.slider img{
width:100%;
min-width:100%;
height:350px;
object-fit:cover;
display:block;
flex-shrink:0;
}


.dots{
position:absolute;
bottom:10px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:8px;
}

.dot{
width:10px;
height:10px;
background:#777;
border-radius:50%;
cursor:pointer;
}

.dot.active{
background:#fff;
}



.info{

padding:25px;

text-align:center;

}



.info h2{

font-size:24px;

margin-bottom:15px;

}



.price{

font-size:30px;

font-weight:bold;

margin:15px 0;

}



.info p{

color:#ccc;

line-height:1.8;

}



.btn{

display:block;

margin-top:20px;

background:#25D366;

color:white;

padding:15px;

border-radius:12px;

text-decoration:none;

font-size:20px;

font-weight:bold;

}



footer{

background:#000;

color:#777;

text-align:center;

padding:25px;

margin-top:40px;

border-top:1px solid #222;

}

</style>

</head>


<body>


<header>

<img src="https://akhbrand.github.io/AKH-BRAND/images/VideoToGif_GIF.gif">

<h1>AKH BRAND</h1>

<p>Luxury Fashion Store</p>

</header>



<section class="hero">

<h2>AKH BRAND</h2>

<p>
جودة عالية • تصميم مميز • أسلوبك الخاص
</p>

</section>



<section class="products" id="products">

</section>



<footer>

© 2026 AKH BRAND

</footer>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyBpFVpOyPfS9C7b8Hit2NpAtcK4k-DeTPw",

authDomain: "akh-brand.firebaseapp.com",

projectId: "akh-brand",

storageBucket: "akh-brand.firebasestorage.app",

messagingSenderId: "671562968837",

appId: "1:671562968837:web:06557b3ab756696cf5116c",

measurementId: "G-L1HPJ8PYMJ"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



const box = document.getElementById("products");


const querySnapshot = await getDocs(collection(db,"products"));


querySnapshot.forEach((doc)=>{


let product = doc.data();

let images = "";
let dots = "";

const imgs = Array.isArray(product.image) ? product.image : [product.image];

imgs.forEach((img,index)=>{

    const imagePath =
        (typeof img === "string" && img.startsWith("http"))
        ? img
        : "./images/" + img;

    images += `
        <img src="${imagePath}" loading="lazy" alt="${product.name}">
    `;

    dots += `
        <span class="dot ${index==0?"active":""}"></span>
    `;

});

images = `
<div class="gallery">

    <div class="slider">

        ${images}

    </div>

    <

    <

    <div class="dots">

        ${dots}

    </div>

</div>
`;






box.innerHTML += `

<div class="card">

${images}

<div class="info">


<h2>${product.name}</h2>


<div class="price">

${product.price}

</div>


<p>الخامة: ${product.material}</p>

<p>المقاس: ${product.size}</p>

<p>الكود: ${product.code}</p>


<p>
${product.description || ""}
</p>


<a class="btn"

href="https://wa.me/201097521334?text=مرحباً، أريد طلب ${product.name} - كود ${product.code}">

اطلب الآن واتساب

</a>


</div>

</div>

`;

});

document.querySelectorAll(".gallery").forEach(gallery=>{

    const slider = gallery.querySelector(".slider");
    
    const dots = gallery.querySelectorAll(".dot");

    let index = 0;

    let startX = 0;
let endX = 0;

gallery.addEventListener("touchstart", e=>{
    startX = e.touches[0].clientX;
});

gallery.addEventListener("touchend", e=>{
    endX = e.changedTouches[0].clientX;

    if(startX - endX > 50){
        showSlide(index + 1); // سحب لليسار
    }

    if(endX - startX > 50){
        showSlide(index - 1); // سحب لليمين
    }
});

    function showSlide(i){

        if(i < 0) i = dots.length - 1;
        if(i >= dots.length) i = 0;

        index = i;

        slider.style.transform = `translateX(-${index * 100}%)`;

        dots.forEach(dot=>dot.classList.remove("active"));
        dots[index].classList.add("active");

    }

    

    dots.forEach((dot,i)=>{
        dot.onclick = ()=>showSlide(i);
    });

});
    
</script>



</body>

</html>
