
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>AKH BRAND | Premium Oversized Streetwear</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Snow -->
  <div class="winterSnow" id="winterSnow"></div>

  <!-- Cart -->
  <a href="cart.html" class="floatingIcon cartIcon" aria-label="السلة">
    <span class="iconEmoji">🛒</span>
    <span class="counter" id="cartCount">0</span>
  </a>

  <!-- Favorites -->
  <a href="favorites.html" class="floatingIcon favIcon" aria-label="المفضلة">
    <span class="iconEmoji">❤️</span>
    <span class="counter" id="favCount">0</span>
  </a>

  <!-- HERO -->
  <main class="winterHero">

    <div class="heroContent">

      <div class="collectionLabel">
        <span>❄</span>
        NEW COLLECTION 2026
        <span>❄</span>
      </div>

      <div class="brandLogo">
        <img
          src="https://akhbrand.github.io/AKH-BRAND/images/VideoToGif_GIF.gif"
          alt="AKH BRAND Logo">
      </div>

      <h1 class="brandTitle">AKH BRAND</h1>

      <div class="brandSubtitle">
        <span></span>
        Premium Oversized Streetwear
        <span></span>
      </div>

      <div class="heroButtons">

        <a href="#products" class="heroButton shopButton">
          تسوق الآن
          <span>❯</span>
        </a>

        <a href="order-tracking.html" class="heroButton ordersButton">
          طلباتي 📦
          <span>❯</span>
        </a>

      </div>

      <a href="#products" class="discoverLink">
        ↓ DISCOVER THE COLLECTION
      </a>

    </div>
  </main>

  <!-- PRODUCTS -->
  <section class="productsSection" id="products">

    <div class="sectionHeading">
      <span>❄</span>
      <h2>WINTER COLLECTION</h2>
      <span>❄</span>
    </div>

    <p class="sectionDescription">
      اكتشف أحدث قطع AKH BRAND
    </p>

    <div class="searchBox">
      <input
        type="search"
        id="searchInput"
        placeholder="ابحث عن المنتج الذي تريده..."
        autocomplete="off">
    </div>

    <div id="products" class="productsGrid"></div>

  </section>

  <!-- FOOTER -->
  <footer class="winterFooter">
    <h2>AKH BRAND</h2>
    <p>PREMIUM OVERSIZED STREETWEAR</p>
    <p>© 2026 AKH BRAND. ALL RIGHTS RESERVED.</p>
  </footer>

  <div id="toast"></div>

  <script>
    // Snow animation
    const snow = document.getElementById("winterSnow");

    for (let i = 0; i < 65; i++) {
      const flake = document.createElement("span");
      flake.className = "snowflake";
      flake.textContent = "❄";
      flake.style.left = Math.random() * 100 + "%";
      flake.style.animationDuration = (5 + Math.random() * 10) + "s";
      flake.style.animationDelay = (Math.random() * 10) + "s";
      flake.style.fontSize = (8 + Math.random() * 12) + "px";
      snow.appendChild(flake);
    }
  </script>

  <!-- Keep existing Firebase and products functionality -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
