
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090a">
  <title>AKH BRAND | Global Streetwear 2027</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <a href="cart.html" class="floatingIcon cartIcon" aria-label="السلة">
    <span class="iconEmoji">🛒</span>
    <span class="counter" id="cartCount">0</span>
  </a>

  <a href="favorites.html" class="floatingIcon favIcon" aria-label="المفضلة">
    <span class="iconEmoji">❤️</span>
    <span class="counter" id="favCount">0</span>
  </a>

  <main class="winterHero">
    <div class="heroContent">

      <div class="collectionLabel">
        NEW COLLECTION 2027
      </div>

      <div class="brandLogo">
        <img
          src="https://akhbrand.github.io/AKH-BRAND/images/VideoToGif_GIF.gif"
          alt="AKH BRAND Logo">
      </div>

      <h1 class="brandTitle">AKH BRAND</h1>

      <div class="brandSubtitle">
        <span></span>
        Premium Oversized Streetwear
        <span></span>
      </div>

      <div class="heroButtons">
        <a href="#productsSection" class="heroButton shopButton">
          تسوق الآن
          <span>❯</span>
        </a>

        <a href="order-tracking.html" class="heroButton ordersButton">
          طلباتي 📦
          <span>❯</span>
        </a>
      </div>

      <a href="#productsSection" class="discoverLink">
        ↓ DISCOVER THE COLLECTION
      </a>

    </div>
  </main>

  <section class="productsSection" id="productsSection">

    <div class="sectionHeading">
      <h2>OVERSIZED STREETWEAR</h2>
    </div>

    <p class="sectionDescription">
      اكتشف أحدث قطع AKH BRAND
    </p>

    <div class="searchBox">
      <input
        type="search"
        id="searchInput"
        placeholder="ابحث عن المنتج الذي تريده..."
        autocomplete="off">
    </div>

    <!-- app.js displays products here; keep this ID unchanged -->
    <div id="products" class="productsGrid"></div>

  </section>

  <footer class="winterFooter">
    <h2>AKH BRAND</h2>
    <p>PREMIUM OVERSIZED STREETWEAR</p>
    <p>© 2027 AKH BRAND. ALL RIGHTS RESERVED.</p>
  </footer>

  <div id="toast"></div>

  <script type="module" src="js/app.js"></script>

</body>
</html>
