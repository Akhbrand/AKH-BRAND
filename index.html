<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKH BRAND</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050505;
color:white;

}


/* الهيدر */

header{

background:#000;
text-align:center;
padding:30px 20px;

border-bottom:1px solid #333;

}


header img{

width:150px;
height:150px;

object-fit:cover;

border-radius:20px;

margin-bottom:15px;

}



header h1{

font-size:38px;

letter-spacing:3px;

}



header p{

color:#aaa;

font-size:18px;

margin-top:8px;

}



/* القائمة */

.menu{

display:flex;

justify-content:center;

gap:20px;

padding:20px;

background:#111;

}


.menu a{

color:white;

text-decoration:none;

font-size:18px;

}



/* البانر */

.hero{

text-align:center;

padding:60px 20px;

background:linear-gradient(#111,#000);

}


.hero h2{

font-size:36px;

margin-bottom:15px;

}


.hero p{

color:#bbb;

font-size:20px;

}



/* المنتجات */

.products{

max-width:1100px;

margin:auto;

padding:40px 20px;

display:grid;

grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

gap:30px;

}



.card{

background:#111;

border-radius:20px;

overflow:hidden;

border:1px solid #333;

transition:.3s;

}


.card:hover{

transform:translateY(-8px);

}



.card img{

width:100%;

height:350px;

object-fit:cover;

}



.info{

padding:25px;

text-align:center;

}


.info h2{

font-size:24px;

}



.price{

font-size:30px;

font-weight:bold;

margin:20px 0;

color:white;

}



.details{

color:#bbb;

line-height:2;

}



.btn{

display:block;

margin-top:20px;

background:#25D366;

color:white;

padding:15px;

border-radius:12px;

text-decoration:none;

font-size:20px;

}



/* الفوتر */

footer{

background:#000;

text-align:center;

padding:25px;

color:#777;

margin-top:40px;

}



</style>

</head>



<body>



<header>


<img src="https://akhbrand.github.io/AKH-BRAND/images/VideoToGif_GIF.gif">


<h1>AKH BRAND</h1>

<p>Luxury Fashion Store</p>


</header>




<div class="menu">

<a href="#">الرئيسية</a>

<a href="#">رجالي</a>

<a href="#">حريمي</a>

<a href="#">العروض</a>

</div>





<section class="hero">


<h2>
أحدث صيحات الموضة
</h2>


<p>
جودة عالية • تصميم مميز • سعر مناسب
</p>


</section>






<section class="products">


<div class="card">


<img src="https://akhbrand.github.io/AKH-BRAND/images/08410060-28e3-4c03-9a0f-43e54e03a360.jpeg">


<div class="info">


<h2>
هودي Brooklyn New York
</h2>


<p class="price">

</p>

<br>

</div>

href="https://wa.me/201097521334?text=مرحباً، أريد طلب هودي Brooklyn New York - كود 758">

</a>



</div>


</div>


</section>





<footer>

© 2026 AKH BRAND

</footer>



</body>

</html>
