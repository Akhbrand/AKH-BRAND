<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إتمام الطلب | AKH BRAND</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23070707'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='%23e8c36b'%3E%E2%99%9B%3C/text%3E%3C/svg%3E">
<meta name="description" content="AKH BRAND - ملابس ستريت وير أوفر سايز بخامات مستوردة. شحن لكل المحافظات والدفع عند الاستلام.">
<meta property="og:type" content="website"><meta property="og:site_name" content="AKH BRAND">
<meta property="og:title" content="AKH BRAND | Feminine Luxury Streetwear">
<meta property="og:description" content="أحدث قطع الأوفر سايز ستريت وير - شحن لكل المحافظات">
<meta property="og:image" content="https://akhbrand.github.io/AKH-BRAND/images/banner-2027.JPG">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/checkout.css">
<link rel="stylesheet" href="css/pro.css">
<script src="js/shared.js"></script>
</head>

<body>

<header class="xBar" id="xBar" data-title="إتمام الطلب"></header>

<div class="checkoutContainer">

<div class="checkoutLeft">

<h2>🛒 ملخص الطلب</h2>

<div id="orderItems"></div>

<div class="totalBox">

<div>
عدد القطع
<br>
<strong id="totalItems">0</strong>
</div>

<div>
الشحن
<br>
<strong id="shipFee">0 EGP</strong>
</div>

<div>
الإجمالي
<br>
<strong id="totalPrice">0 EGP</strong>
</div>

</div>

</div>

<div class="checkoutRight">

<h2>📋 بيانات العميل</h2>

<input type="text" id="customerName" placeholder="الاسم بالكامل">

<input type="tel" id="customerPhone" placeholder="رقم الهاتف">

<select id="customerGovernorate">

<option value="">اختر المحافظة</option>

<option>القاهرة</option>
<option>الجيزة</option>
<option>الإسكندرية</option>
<option>القليوبية</option>
<option>الشرقية</option>
<option>الغربية</option>
<option>المنوفية</option>
<option>البحيرة</option>
<option>الدقهلية</option>
<option>كفر الشيخ</option>
<option>دمياط</option>
<option>بورسعيد</option>
<option>الإسماعيلية</option>
<option>السويس</option>
<option>الفيوم</option>
<option>بني سويف</option>
<option>المنيا</option>
<option>أسيوط</option>
<option>سوهاج</option>
<option>قنا</option>
<option>الأقصر</option>
<option>أسوان</option>

</select>

<input type="text" id="customerCity" placeholder="المدينة">

<textarea id="customerAddress" placeholder="العنوان بالكامل"></textarea>

<h3>🚚 طريقة الدفع</h3>

<label class="radioBox">

<input type="radio" name="payment" value="الدفع عند الاستلام" checked>

الدفع عند الاستلام

</label>

<label class="radioBox">

<input type="radio" name="payment" value="Vodafone Cash">

Vodafone Cash

</label>

<label class="radioBox">

<input type="radio" name="payment" value="InstaPay">

InstaPay

</label>

<textarea id="customerNotes" placeholder="ملاحظات (اختياري)"></textarea>

<button id="sendOrder" class="confirmBtn">

✅ تأكيد الطلب

</button>

</div>

</div>

<footer>

© 2026 AKH BRAND

</footer>

<script type="module" src="js/checkout.js"></script>

</body>

</html>
