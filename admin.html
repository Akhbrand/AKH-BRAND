<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKH BRAND Admin</title>

<style>

body{
background:#050505;
color:white;
font-family:Arial;
padding:20px;
}

.box{
max-width:600px;
margin:auto;
background:#111;
padding:30px;
border-radius:20px;
border:1px solid #333;
}

h1{
text-align:center;
}

input,textarea{

width:100%;
padding:15px;
margin:10px 0;
border-radius:10px;
border:none;

}

textarea{
height:120px;
}


button{

width:100%;
padding:15px;
background:#25D366;
color:white;
border:0;
border-radius:10px;
font-size:18px;

}


#preview img{

width:100px;
height:100px;
object-fit:cover;
border-radius:10px;
margin:5px;

}

</style>

</head>


<body>


<div class="box">


<h1>
إضافة منتج AKH BRAND
</h1>


<input id="name" placeholder="اسم المنتج">

<input id="price" placeholder="السعر">

<input id="material" placeholder="الخامة">

<input id="size" placeholder="المقاس">

<input id="code" placeholder="الكود">


<textarea id="description" placeholder="وصف المنتج"></textarea>


<input type="file" id="images" multiple accept="image/*">


<div id="preview"></div>


<button onclick="addProduct()">
نشر المنتج
</button>


<p id="msg"></p>


</div>



<script type="module">


import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyBpFVpOyPfS9C7b8Hit2NpAtcK4k-DeTPw",

authDomain: "akh-brand.firebaseapp.com",

projectId: "akh-brand",

storageBucket: "akh-brand.firebasestorage.app",

messagingSenderId: "671562968837",

appId: "1:671562968837:web:06557b3ab756696cf5116c",

measurementId: "G-L1HPJ8PYMJ"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



let imageUrls=[];



document.getElementById("images").addEventListener("change",function(){

let preview=document.getElementById("preview");

preview.innerHTML="";


for(let file of this.files){

let img=document.createElement("img");

img.src=URL.createObjectURL(file);

preview.appendChild(img);

}

});




async function uploadImage(file){


let formData=new FormData();

formData.append("file",file);

formData.append("upload_preset","akh_upload");



let res=await fetch(

"https://api.cloudinary.com/v1_1/yhwzc937/image/upload",

{

method:"POST",

body:formData

}

);


let data=await res.json();

return data.secure_url;


}





window.addProduct = async function(){


let files=document.getElementById("images").files;


imageUrls=[];


for(let file of files){

let url=await uploadImage(file);

imageUrls.push(url);

}



await addDoc(collection(db,"products"),{


name: name.value,

price: price.value,

material: material.value,

size: size.value,

code: code.value,

description: description.value,

image:imageUrls


});


document.getElementById("msg").innerHTML="✅ تم نشر المنتج";


}


</script>


</body>

</html>
