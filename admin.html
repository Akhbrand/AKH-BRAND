<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKH BRAND Admin</title>

<style>

body{
background:#050505;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

.box{

max-width:600px;
margin:auto;
background:#111;
padding:30px;
border-radius:20px;
border:1px solid #333;

}

h1{
text-align:center;
margin-bottom:25px;
}

input, textarea{

width:100%;
padding:15px;
margin:10px 0;
border-radius:10px;
border:none;
font-size:16px;

}

textarea{
height:120px;
}


button{

width:100%;
padding:15px;
background:#25D366;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;

}


#msg{

margin-top:20px;
text-align:center;

}

</style>

</head>


<body>


<div class="box">

<h1>
إضافة منتج AKH BRAND
</h1>


<input id="name" placeholder="اسم المنتج">


<input id="price" placeholder="السعر">


<input id="material" placeholder="الخامة">


<input id="size" placeholder="المقاس">


<input id="code" placeholder="الكود">


<textarea id="description" placeholder="وصف المنتج"></textarea>


<input id="image" placeholder="أسماء الصور (افصل بينهم بفاصلة)">


<button onclick="addProduct()">
نشر المنتج
</button>


<p id="msg"></p>


</div>



<script type="module">


import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyBpFVpOyPfS9C7b8Hit2NpAtcK4k-DeTPw",

authDomain: "akh-brand.firebaseapp.com",

projectId: "akh-brand",

storageBucket: "akh-brand.firebasestorage.app",

messagingSenderId: "671562968837",

appId: "1:671562968837:web:06557b3ab756696cf5116c",

measurementId: "G-L1HPJ8PYMJ"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



window.addProduct = async function(){


let images = document
.getElementById("image")
.value
.split(",")
.map(img => img.trim());


await addDoc(collection(db,"products"),{


name: document.getElementById("name").value,

price: document.getElementById("price").value,

material: document.getElementById("material").value,

size: document.getElementById("size").value,

code: document.getElementById("code").value,

description: document.getElementById("description").value,

image: images


});


document.getElementById("msg").innerHTML="✅ تم إضافة المنتج بنجاح";


}



</script>


</body>

</html>
