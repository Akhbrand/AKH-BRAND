<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم استلام طلبك | AKH BRAND</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23070707'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='%23e8c36b'%3E%E2%99%9B%3C/text%3E%3C/svg%3E">
<meta name="description" content="AKH BRAND - ملابس ستريت وير أوفر سايز بخامات مستوردة. شحن لكل المحافظات والدفع عند الاستلام.">
<meta property="og:type" content="website"><meta property="og:site_name" content="AKH BRAND">
<meta property="og:title" content="AKH BRAND | Feminine Luxury Streetwear">
<meta property="og:description" content="أحدث قطع الأوفر سايز ستريت وير - شحن لكل المحافظات">
<meta property="og:image" content="https://akhbrand.github.io/AKH-BRAND/images/banner-2027.JPG">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pro.css">
<script src="js/shared.js"></script>
</head>
<body>
<header class="xBar" id="xBar" data-title="تم استلام طلبك"></header>
<main class="xPage" id="box"></main>
<script>
let o=null;try{o=JSON.parse(sessionStorage.getItem("lastOrder"))}catch(e){}
const box=document.getElementById("box");
if(!o){box.innerHTML='<div class="xEmpty"><div>📦</div><h2>مفيش طلب حديث</h2><a class="btn" href="order-tracking.html">تتبع طلبك</a></div>';}
else{
 const pay=o.payment!=="الدفع عند الاستلام";
 const msg=encodeURIComponent("مرحبا، طلبي رقم "+o.orderNumber+(pay?" وعايزة بيانات الدفع ("+o.payment+")":""));
 box.innerHTML=`<div class="xDone"><div class="xTick">✓</div><h2>تم استلام طلبك بنجاح</h2>
 <p>رقم الطلب</p><div class="xCode" id="oc">${AKH.esc(o.orderNumber)}</div>
 <button class="favWide" onclick="navigator.clipboard&&navigator.clipboard.writeText('${AKH.esc(o.orderNumber)}');AKH.toast('تم نسخ رقم الطلب')">📋 نسخ رقم الطلب</button>
 <p class="xMeta">احتفظي بالرقم ده، هتحتاجيه مع رقم الهاتف لتتبع الطلب. الإجمالي: <b>${AKH.money(o.total)}</b> شامل الشحن.</p>
 <ol class="xSteps"><li>فريقنا هيتواصل معاكِ على الهاتف لتأكيد الطلب.</li>
 ${pay?`<li>الدفع عن طريق <b>${AKH.esc(o.payment)}</b>: ابعتيلنا رقم الطلب على واتساب وهنرسل لك بيانات التحويل.</li>`:`<li>الدفع عند الاستلام.</li>`}
 <li>التوصيل بيكون خلال 2-5 أيام عمل لكل المحافظات.</li></ol>
 <a class="btn" target="_blank" rel="noopener" href="https://wa.me/${AKH.WA}?text=${msg}">${pay?"💬 ابعتي رقم الطلب على واتساب":"💬 تواصلي معنا على واتساب"}</a>
 <a class="favWide" style="display:block;text-align:center;margin-top:10px" href="order-tracking.html?order=${encodeURIComponent(o.orderNumber)}">📦 تتبع الطلب</a></div>`;
}
</script>
</body></html>
