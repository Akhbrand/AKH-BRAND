<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKH BRAND Admin Login</title>

<link rel="stylesheet" href="css/admin.css">

</head>


<body>


<div class="box loginBox">


<div class="adminHeader">

<h1>
AKH BRAND
</h1>

<p>
تسجيل دخول لوحة التحكم
</p>

</div>




<input type="email" id="adminEmail" placeholder="البريد الإلكتروني" dir="ltr">

<input 
type="password"
id="adminPassword"
placeholder="كلمة المرور">



<button id="loginBtn">

🔐 دخول

</button>



<p id="loginMsg"></p>



</div>





<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const auth=getAuth(initializeApp({apiKey:"AIzaSyBpFVpOyPfS9C7b8Hit2NpAtcK4k-DeTPw",authDomain:"akh-brand.firebaseapp.com",projectId:"akh-brand",appId:"1:671562968837:web:06557b3ab756696cf5116c"}));
const msg=document.getElementById("loginMsg"), btn=document.getElementById("loginBtn");
btn.onclick=async()=>{
 btn.disabled=true; msg.textContent="⏳";
 try{await signInWithEmailAndPassword(auth,document.getElementById("adminEmail").value.trim(),document.getElementById("adminPassword").value);location.href="admin.html";}
 catch(e){msg.textContent="❌ بيانات الدخول غير صحيحة";btn.disabled=false;}
};
</script>
</body>
</html>
