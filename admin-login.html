<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKH BRAND Admin Login</title>

<link rel="stylesheet" href="css/admin.css">

</head>


<body>


<div class="box loginBox">


<div class="adminHeader">

<h1>
AKH BRAND
</h1>

<p>
تسجيل دخول لوحة التحكم
</p>

</div>




<input type="email" id="adminEmail" placeholder="ahmedkhaledahk411@gmail.com" dir="ltr" autocomplete="username">

<input 
type="password"
id="adminPassword"
placeholder="Akm_akm22" autocomplete="current-password">



<button id="loginBtn">

🔐 دخول

</button>



<p id="loginMsg"></p>



</div>





<script>
const OK = "0d21938906a69c9b67a58ff0365a091635f257e40902760047cfb0a9d50720f9";
async function sha(t){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
async function login(){
  const email = document.getElementById("adminEmail").value.trim().toLowerCase();
  const pass = document.getElementById("adminPassword").value;
  const msg = document.getElementById("loginMsg");
  if (await sha(email + ":" + pass) === OK) {
    localStorage.setItem("adminLogin", "true");
    window.location.href = "admin.html";
  } else {
    msg.innerHTML = "❌ البريد أو كلمة المرور غير صحيحة";
  }
}
document.getElementById("loginBtn").onclick = login;
document.getElementById("adminPassword").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
</script>
</body>
</html>
