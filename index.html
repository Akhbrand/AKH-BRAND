<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">

  <title>AKH BRAND | New Collection 2027</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <style>
    .akhFullBanner {
      position: relative !important;
      width: 100% !important;
      max-width: 1600px !important;
      aspect-ratio: 16 / 9 !important;
      height: auto !important;
      margin: 0 auto !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: #050505 !important;
      isolation: isolate;
    }

    .akhFullBanner > img.akhBannerArt {
      position: absolute !important;
      inset: 0 !important;
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      object-position: center center !important;
      z-index: 1 !important;
      pointer-events: none;
    }

    .akhBannerOverlayActions {
      position: absolute !important;
      left: 53.5% !important;
      top: 69% !important;
      width: 39% !important;
      height: 12.5% !important;
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 3% !important;
      z-index: 3 !important;
    }

    .akhBannerHitButton {
      flex: 1 1 0 !important;
      height: 100% !important;
      border-radius: 999px !important;
      background: transparent !important;
      border: none !important;
      color: transparent !important;
      font-size: 0 !important;
      line-height: 0 !important;
      text-decoration: none !important;
      cursor: pointer !important;
    }

    .productsSection {
      width: 95%;
      max-width: 1450px;
      margin: 45px auto;
    }
  </style>
</head>

<body>

  <header class="akhTopbar">
    <div class="akhTopbarActions">
      <a href="cart.html" class="akhRoundAction" aria-label="السلة">
        🛒 <span class="counter" id="cartCount">0</span>
      </a>

      <a href="favorites.html" class="akhRoundAction" aria-label="المفضلة">
        ♥ <span class="counter" id="favCount">0</span>
      </a>
    </div>

    <a class="akhTopbarLogo" href="index.html">
      <span class="akhHeaderCrown">♛</span>
      <span class="akhHeaderName">AKH BRAND</span>
    </a>

    <nav class="akhNav" aria-label="القائمة الرئيسية">
      <a href="index.html">الرئيسية</a>
      <a href="#productsSection">المنتجات</a>
      <a href="cart.html">سلة التسوق</a>
      <a href="favorites.html">المفضلة</a>
      <a href="order-tracking.html">تتبع الطلب</a>
    </nav>
  </header>

  <main class="akhFullBanner" aria-label="AKH BRAND New Collection 2027">
    <img
      src="images/banner-2027.jpg"
      alt="AKH BRAND - NEW COLLECTION 2027"
      class="akhBannerArt"
    >

    <div class="akhBannerOverlayActions">
      <a href="#productsSection" class="akhBannerHitButton" aria-label="تسوق الآن">تسوق الآن</a>
      <a href="order-tracking.html" class="akhBannerHitButton" aria-label="طلباتي">طلباتي</a>
    </div>
  </main>

  <section class="productsSection" id="productsSection">
    <div class="sectionHeading">
      <h2>OVERSIZED STREETWEAR</h2>
    </div>

    <p class="sectionDescription">
      اكتشفي أحدث قطع AKH BRAND
    </p>

    <div class="searchBox">
      <input
        type="search"
        id="searchInput"
        placeholder="ابحثي عن المنتج الذي تريدينه..."
        autocomplete="off"
      >
    </div>

    <div id="products" class="productsGrid"></div>
  </section>

  <footer class="winterFooter">
    <h2>AKH BRAND</h2>
    <p>FEMININE LUXURY STREETWEAR</p>
    <p>Fashion • Style • Confidence</p>
    <p>© 2027 AKH BRAND. ALL RIGHTS RESERVED.</p>
  </footer>

  <div id="toast"></div>

  <script type="module" src="js/app.js"></script>

</body>
</html>
