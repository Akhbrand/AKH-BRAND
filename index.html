<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKH BRAND</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050505;
color:white;
}


header{
background:#000;
text-align:center;
padding:35px 20px;
border-bottom:1px solid #222;
}


header img{
width:160px;
height:160px;
object-fit:cover;
border-radius:20px;
margin-bottom:15px;
}


header h1{
font-size:42px;
letter-spacing:4px;
}


header p{
color:#aaa;
font-size:18px;
margin-top:10px;
}



.hero{

text-align:center;
padding:60px 20px;
background:linear-gradient(#111,#050505);

}


.hero h2{
font-size:36px;
margin-bottom:15px;
}


.hero p{
color:#bbb;
font-size:20px;
}



.products{

max-width:1200px;
margin:auto;
padding:40px 20px;

display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

gap:30px;

}



.card{

background:#111;

border:1px solid #333;

border-radius:20px;

overflow:hidden;

transition:.3s;

}


.card:hover{

transform:translateY(-8px);

}



.gallery{

display:flex;

gap:10px;

overflow-x:auto;

padding:10px;

}


.gallery img{

width:100%;

min-width:100%;

height:350px;

object-fit:cover;

border-radius:15px;

}



.info{

padding:25px;

text-align:center;

}



.info h2{

font-size:24px;

margin-bottom:15px;

}



.price{

font-size:30px;

font-weight:bold;

margin:15px 0;

}



.info p{

color:#ccc;

line-height:1.8;

}



.btn{

display:block;

margin-top:20px;

background:#25D366;

color:white;

padding:15px;

border-radius:12px;

text-decoration:none;

font-size:20px;

font-weight:bold;

}



footer{

background:#000;

color:#777;

text-align:center;

padding:25px;

margin-top:40px;

border-top:1px solid #222;

}


</style>

</head>


<body>


<header>

<img src="https://akhbrand.github.io/AKH-BRAND/images/VideoToGif_GIF.gif">

<h1>AKH BRAND</h1>

<p>Luxury Fashion Store</p>

</header>



<section class="hero">

<h2>
أحدث صيحات الموضة
</h2>

<p>
جودة عالية • تصميم مميز • أسلوبك الخاص
</p>

</section>



<section class="products" id="products">

</section>




<footer>

© 2026 AKH BRAND

</footer>



<script>


fetch("products.json")

.then(response => response.json())

.then(products => {


let box = document.getElementById("products");


products.forEach(product => {


let images = "";


if(Array.isArray(product.image)){


product.image.forEach(img => {

images += `

<img src="./images/${img}">

`;

});


}else{


images = `

<img src="./images/${product.image}">

`;

}



box.innerHTML += `


<div class="card">


<div class="gallery">

${images}

</div>


<div class="info">


<h2>
${product.name}
</h2>


<div class="price">

${product.price}

</div>


<p>
الخامة: ${product.material}
</p>


<p>
المقاس: ${product.size}
</p>


<p>
الكود: ${product.code}
</p>



<a class="btn"

href="https://wa.me/201097521334?text=مرحباً، أريد طلب ${product.name} - كود ${product.code}">

اطلب الآن واتساب

</a>


</div>


</div>


`;


});


});


</script>



</body>

</html>
