<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إتمام الطلب | AKH BRAND</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/checkout.css">
</head>

<body>

<header>

<img src="https://akhbrand.github.io/AKH-BRAND/images/VideoToGif_GIF.gif">

<h1>إتمام الطلب</h1>

<p>AKH BRAND</p>

</header>

<div class="checkoutContainer">

<div class="checkoutLeft">

<h2>🛒 ملخص الطلب</h2>

<div id="orderItems"></div>

<div class="totalBox">

<div>
عدد القطع
<br>
<strong id="totalItems">0</strong>
</div>

<div>
الإجمالي
<br>
<strong id="totalPrice">0 EGP</strong>
</div>

</div>

</div>

<div class="checkoutRight">

<h2>📋 بيانات العميل</h2>

<input type="text" id="customerName" placeholder="الاسم بالكامل">

<input type="tel" id="customerPhone" placeholder="رقم الهاتف">

<select id="customerGovernorate">

<option value="">اختر المحافظة</option>

<option>القاهرة</option>
<option>الجيزة</option>
<option>الإسكندرية</option>
<option>القليوبية</option>
<option>الشرقية</option>
<option>الغربية</option>
<option>المنوفية</option>
<option>البحيرة</option>
<option>الدقهلية</option>
<option>كفر الشيخ</option>
<option>دمياط</option>
<option>بورسعيد</option>
<option>الإسماعيلية</option>
<option>السويس</option>
<option>الفيوم</option>
<option>بني سويف</option>
<option>المنيا</option>
<option>أسيوط</option>
<option>سوهاج</option>
<option>قنا</option>
<option>الأقصر</option>
<option>أسوان</option>

</select>

<input type="text" id="customerCity" placeholder="المدينة">

<textarea id="customerAddress" placeholder="العنوان بالكامل"></textarea>

<h3>🚚 طريقة الدفع</h3>

<label class="radioBox">

<input type="radio" name="payment" value="الدفع عند الاستلام" checked>

الدفع عند الاستلام

</label>

<label class="radioBox">

<input type="radio" name="payment" value="Vodafone Cash">

Vodafone Cash

</label>

<label class="radioBox">

<input type="radio" name="payment" value="InstaPay">

InstaPay

</label>

<textarea id="customerNotes" placeholder="ملاحظات (اختياري)"></textarea>

<button id="sendOrder" class="confirmBtn">

✅ تأكيد الطلب

</button>

</div>

</div>

<footer>

© 2026 AKH BRAND

</footer>

<script type="module" src="js/checkout.js"></script>

</body>

</html>
