<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<link rel="stylesheet" href="css/admin.css">

<title>AKH BRAND Admin</title>



</head>


<body>


<div class="box">

  <div class="adminHeader">

<h1>AKH BRAND</h1>

<p>لوحة التحكم</p>

</div>


<div class="sectionTitle">
➕ إضافة منتج جديد
</div>
<div class="stats">

<div class="statCard">
<span id="productsCount">0</span>
<p>📦 المنتجات</p>
</div>

<div class="statCard">
<span id="ordersCount">0</span>
<p>🛒 الطلبات</p>
</div>

<div class="statCard">
<span id="newOrders">0</span>
<p>🆕 الجديدة</p>
</div>

<div class="statCard">
<span id="salesTotal">0 EGP</span>
<p>💰 المبيعات</p>
</div>

</div>

<input id="name" placeholder="اسم المنتج">

<input id="price" placeholder="السعر">

<input id="material" placeholder="الخامة">

<input id="size" placeholder="المقاس">

<input id="code" placeholder="الكود">


<textarea id="description" placeholder="وصف المنتج"></textarea>


<input type="file" id="images" multiple accept="image/*">


<div id="preview"></div>


<button onclick="addProduct()">
نشر المنتج
</button>


<p id="msg"></p>

  <hr style="margin:30px 0;border:1px solid #333;">

<div class="sectionTitle">
📦 المنتجات الموجودة
</div>

<div id="productsList"></div>

<hr style="margin:40px 0;border:1px solid #333;">

<h2 style="text-align:center;">
🛒 الطلبات الواردة
</h2>

<div id="ordersList"></div>

</div>



<script type="module">


import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyBpFVpOyPfS9C7b8Hit2NpAtcK4k-DeTPw",

authDomain: "akh-brand.firebaseapp.com",

projectId: "akh-brand",

storageBucket: "akh-brand.firebasestorage.app",

messagingSenderId: "671562968837",

appId: "1:671562968837:web:06557b3ab756696cf5116c",

measurementId: "G-L1HPJ8PYMJ"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



let imageUrls=[];



document.getElementById("images").addEventListener("change",function(){

let preview=document.getElementById("preview");

preview.innerHTML="";


for(let file of this.files){

let img=document.createElement("img");

img.src=URL.createObjectURL(file);

preview.appendChild(img);

}

});




async function uploadImage(file){


let formData = new FormData();


formData.append("file",file);

formData.append("upload_preset","akh_upload");



let response = await fetch(

"https://api.cloudinary.com/v1_1/yhwzc937/image/upload",

{

method:"POST",

body:formData

}

);



let data = await response.json();


if(!data.secure_url){

throw new Error("فشل رفع الصورة");

}


return data.secure_url;


}





window.addProduct = async function(){


try{


document.getElementById("msg").innerHTML="⏳ جاري النشر...";


let files=document.getElementById("images").files;



if(files.length===0){

document.getElementById("msg").innerHTML="❌ اختر صور المنتج";

return;

}



imageUrls=[];



for(let file of files){

let url = await uploadImage(file);

imageUrls.push(url);

}




await addDoc(collection(db,"products"),{


name: document.getElementById("name").value,

price: document.getElementById("price").value,

material: document.getElementById("material").value,

size: document.getElementById("size").value,

code: document.getElementById("code").value,

description: document.getElementById("description").value,

image:imageUrls


});



document.getElementById("msg").innerHTML="✅ تم نشر المنتج بنجاح";

document.getElementById("name").value = "";
document.getElementById("price").value = "";
document.getElementById("material").value = "";
document.getElementById("size").value = "";
document.getElementById("code").value = "";
document.getElementById("description").value = "";
document.getElementById("images").value = "";
document.getElementById("preview").innerHTML = "";

loadProducts();


}



catch(error){


console.log(error);


document.getElementById("msg").innerHTML=
"❌ خطأ: "+error.message;


}



}

async function loadProducts() {

    const list = document.getElementById("productsList");

    list.innerHTML = "";

    const snapshot = await getDocs(collection(db, "products"));
  document.getElementById("productsCount").innerText =
snapshot.size;

    snapshot.forEach((item) => {

        const product = item.data();

     const image =
Array.isArray(product.image)
? product.image[0]
: product.image;

list.innerHTML += `

<div class="productCard">

    <img
    src="${image}"
    class="productImage">

    <div class="productInfo">

        <h3>${product.name}</h3>

        <p>💰 ${product.price}</p>

        <p>🏷️ ${product.code}</p>

        <button
        onclick="deleteProduct('${item.id}')"
        class="deleteProductBtn">

        🗑️ حذف المنتج

        </button>

    </div>

</div>

`;
    });

}

window.deleteProduct = async function(id){

    let ok = confirm("هل أنت متأكد من حذف المنتج؟");

    if(!ok) return;

    await deleteDoc(doc(db,"products",id));

    alert("✅ تم حذف المنتج");

    loadProducts();

};

loadProducts();

async function loadOrders() {

    const list = document.getElementById("ordersList");

    list.innerHTML = "";

    const snapshot = await getDocs(collection(db, "orders"));
  
document.getElementById("ordersCount").innerText =
snapshot.size;
    if (snapshot.empty) {

        list.innerHTML = `
      <div class="orderCard">
            لا توجد طلبات حالياً
        </div>
        `;

        return;
    }
  
let newOrders = 0;
let totalSales = 0;
    snapshot.forEach((item) => {

        const order = item.data();
      
if(order.status === "جديد"){
    newOrders++;
}

totalSales += Number(order.total || 0);
        list.innerHTML += `

       <div class="orderCard">
            <h3>👤 ${order.customerName}</h3>

            <p>📞 ${order.customerPhone}</p>

            <p>📍 ${order.governorate} - ${order.city}</p>

            <p>💰 ${order.total} EGP</p>

            <p>💳 ${order.payment}</p>

<p style="margin-top:15px;">
📦 الحالة الحالية:
<strong>${order.status}</strong>
</p>

<select
onchange="changeStatus('${item.id}',this.value)"
style="
width:100%;
padding:12px;
border-radius:10px;
background:#222;
color:#fff;
border:1px solid #444;
">

<option ${order.status=="جديد"?"selected":""}>
جديد
</option>

<option ${order.status=="جاري التجهيز"?"selected":""}>
جاري التجهيز
</option>

<option ${order.status=="تم الشحن"?"selected":""}>
تم الشحن
</option>

<option ${order.status=="تم التسليم"?"selected":""}>
تم التسليم
</option>

</select>

<div class="orderActions">

<button
onclick="toggleProducts('${item.id}')">
📦 عرض المنتجات
</button>

<button
onclick="deleteOrder('${item.id}')"
class="deleteProductBtn">
🗑️ حذف الطلب
</button>

</div>

<div
id="products-${item.id}"
class="orderProducts"
style="display:none;"></div>

</div>

`;

    });
  document.getElementById("newOrders").innerText =
newOrders;

document.getElementById("salesTotal").innerText =
totalSales + " EGP";

}

loadOrders();
  window.toggleProducts = async function(id){

    const box = document.getElementById("products-"+id);

    if(box.style.display==="block"){

        box.style.display="none";
        return;

    }

    box.style.display="block";

    const snapshot = await getDocs(collection(db,"orders"));

    snapshot.forEach(docItem=>{

        if(docItem.id!==id) return;

        const order = docItem.data();

        let html="";

        order.products.forEach(product=>{

            html += `

            <div style="
            background:#111;
            padding:12px;
            border-radius:10px;
            margin-top:10px;
            ">

                <strong>${product.name}</strong>

                <br>

                الكمية: ${product.quantity || 1}

                <br>

                السعر: ${product.price}

            </div>

            `;

        });

       box.innerHTML = html;

    });

};
  window.changeStatus = async function(id,status){

    await updateDoc(
        doc(db,"orders",id),
        {
            status:status
        }
    );

    alert("✅ تم تحديث حالة الطلب");

};
  window.deleteOrder = async function(id){

    const ok = confirm("هل أنت متأكد من حذف هذا الطلب؟");

    if(!ok) return;

    await deleteDoc(doc(db,"orders",id));

    alert("✅ تم حذف الطلب");

loadOrders();

};

</script>


</body>

</html>
