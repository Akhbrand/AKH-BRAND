<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">

  <title>AKH BRAND | New Collection 2027</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* =========================================
       AKH BRAND - NEW COLLECTION 2027 BANNER
       الصورة كاملة + أزرار حقيقية فوقها
    ========================================= */

    .akhFullBanner {
      position: relative !important;
      display: block !important;
      width: 100% !important;
      height: auto !important;
      min-height: 0 !important;
      max-height: none !important;
      aspect-ratio: 1672 / 941;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: #050505 !important;
    }

    .akhFullBanner::after {
      display: none !important;
    }

    .akhFullBanner > img {
      position: absolute !important;
      inset: 0 !important;
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      object-position: center center !important;
      z-index: 0 !important;
    }

    /* أزرار شفافة فوق أزرار الصورة */

    .akhFullBanner .bannerHotspot {
      position: absolute !important;
      z-index: 5 !important;
      display: block !important;
      border-radius: 999px !important;
      background: transparent !important;
      border: 0 !important;
      text-indent: -9999px;
      overflow: hidden;
      -webkit-tap-highlight-color: rgba(232,195,107,.25);
      transition: box-shadow .3s ease, transform .3s ease;
    }

    .akhFullBanner .bannerHotspot:hover {
      box-shadow: 0 0 24px rgba(232,195,107,.55);
      transform: translateY(-2px);
    }

    /* زر تسوق الآن */
    .akhFullBanner .shopHotspot {
      left: 54.4%;
      top: 70.1%;
      width: 18.7%;
      height: 10.2%;
    }

    /* زر طلباتي */
    .akhFullBanner .ordersHotspot {
      left: 74.6%;
      top: 70.1%;
      width: 17.4%;
      height: 10.2%;
    }

    /* =========================================
       PRODUCTS SECTION
    ========================================= */

    .productsSection {
      width: 95%;
      max-width: 1450px;
      margin: 45px auto;
    }

  </style>

</head>

<body>

  <!-- HEADER -->

  <header class="akhTopbar">

    <div class="akhTopbarActions">

      <a href="cart.html" class="akhRoundAction" aria-label="السلة">
        🛒 <span class="counter" id="cartCount">0</span>
      </a>

      <a href="favorites.html" class="akhRoundAction" aria-label="المفضلة">
        ♥ <span class="counter" id="favCount">0</span>
      </a>

    </div>

    <a class="akhTopbarLogo" href="index.html">
      <span class="akhHeaderCrown">♛</span>
      <span class="akhHeaderName">AKH BRAND</span>
    </a>

    <nav class="akhNav" aria-label="القائمة الرئيسية">

      <a href="index.html">الرئيسية</a>
      <a href="#productsSection">المنتجات</a>
      <a href="cart.html">سلة التسوق</a>
      <a href="favorites.html">المفضلة</a>
      <a href="order-tracking.html">تتبع الطلب</a>

    </nav>

  </header>

  <!-- WINTER HERO BANNER -->

  <main class="akhFullBanner">

    <img
      src="images/banner-2027.jpg"
      alt="AKH BRAND New Collection 2027 - Feminine Luxury Streetwear"
    >

    <a href="#productsSection" class="bannerHotspot shopHotspot" aria-label="تسوق الآن">تسوق الآن</a>

    <a href="order-tracking.html" class="bannerHotspot ordersHotspot" aria-label="طلباتي">طلباتي</a>

  </main>

  <!-- PRODUCTS -->

  <section class="productsSection" id="productsSection">

    <div class="sectionHeading">
      <h2>OVERSIZED STREETWEAR</h2>
    </div>

    <p class="sectionDescription">
      اكتشفي أحدث قطع AKH BRAND
    </p>

    <div class="searchBox">

      <input
        type="search"
        id="searchInput"
        placeholder="ابحثي عن المنتج الذي تريدينه..."
        autocomplete="off"
      >

    </div>

    <div id="products" class="productsGrid"></div>

  </section>

  <!-- FOOTER -->

  <footer class="winterFooter">

    <h2>AKH BRAND</h2>

    <p>FEMININE LUXURY STREETWEAR</p>

    <p>Fashion • Style • Confidence</p>

    <p>© 2027 AKH BRAND. ALL RIGHTS RESERVED.</p>

  </footer>

  <div id="toast"></div>

  <!-- ORIGINAL FIREBASE APP -->

  <script type="module" src="js/app.js"></script>

</body>
</html>
